name: Test publishing icons and pictograms to COS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-assets-cdn-test
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      COS_BUCKET: ${{ secrets.CARBON_CDN_TEST_BUCKET }}
      COS_ENDPOINT_HOST: ${{ secrets.CARBON_CDN_TEST_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        env:
          YARN_ENABLE_HARDENED_MODE: 0
        run: yarn install --immutable

      - name: Verify publishing configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CARBON_CDN_TEST_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:
            ${{ secrets.CARBON_CDN_TEST_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CARBON_CDN_TEST_REGION }}
        run: |
          aws --version
          test -n "${AWS_ACCESS_KEY_ID}"
          test -n "${AWS_SECRET_ACCESS_KEY}"
          test -n "${AWS_DEFAULT_REGION}"
          test -n "${COS_BUCKET}"
          test -n "${COS_ENDPOINT_HOST}"

      - name: Build icons and pictograms
        run: |
          yarn lerna run build \
            --scope='@carbon/icons' \
            --scope='@carbon/pictograms' \
            --include-dependencies \
            --stream

      - name: Verify generated SVGs
        run: |
          test -n "$(find packages/icons/svg -type f -name '*.svg' -print -quit)"
          test -n "$(find packages/pictograms/svg -type f -name '*.svg' -print -quit)"

      - name: Upload icons
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CARBON_CDN_TEST_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:
            ${{ secrets.CARBON_CDN_TEST_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CARBON_CDN_TEST_REGION }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          aws s3 sync \
            packages/icons/svg \
            "s3://${COS_BUCKET}/carbon/cdn-test/icons" \
            --endpoint-url "https://${COS_ENDPOINT_HOST}" \
            --no-progress \
            --cache-control 'public,max-age=300' \
            --content-type 'image/svg+xml'

      - name: Upload pictograms
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CARBON_CDN_TEST_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:
            ${{ secrets.CARBON_CDN_TEST_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CARBON_CDN_TEST_REGION }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          aws s3 sync \
            packages/pictograms/svg \
            "s3://${COS_BUCKET}/carbon/cdn-test/pictograms" \
            --endpoint-url "https://${COS_ENDPOINT_HOST}" \
            --no-progress \
            --cache-control 'public,max-age=300' \
            --content-type 'image/svg+xml'

      - name: Verify public URLs
        run: |
          curl --fail --silent --show-error --head \
            "https://${COS_BUCKET}.${COS_ENDPOINT_HOST}/carbon/cdn-test/icons/16/apps.svg"
          curl --fail --silent --show-error --head \
            "https://${COS_BUCKET}.${COS_ENDPOINT_HOST}/carbon/cdn-test/pictograms/accessibility.svg"
